<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Absolute Pitch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Absolute Pitch</h1>

    <button id="playBtn">Play Note</button>
    <button id="repeatBtn">Repeat Note</button>

    <div id="keyboard">
        <div class="key white" data-note="C"></div>
        <div class="key black" data-note="C#"></div>
        <div class="key white" data-note="D"></div>
        <div class="key black" data-note="D#"></div>
        <div class="key white" data-note="E"></div>
        <div class="key white" data-note="F"></div>
        <div class="key black" data-note="F#"></div>
        <div class="key white" data-note="G"></div>
        <div class="key black" data-note="G#"></div>
        <div class="key white" data-note="A"></div>
        <div class="key black" data-note="A#"></div>
        <div class="key white" data-note="B"></div>
    </div>

    <p id="feedback"></p>

    <div id ="settings">
    <p>Settings</p>
        <div id="feedbackAudio">
            <input type="radio" id="isCorrectRadio" name="feedbackAudio" value="isCorrect" checked>
            <label for="isCorrectRadio">isCorrect</label><br>
            
            <input type="radio" id="correctNoteRadio" name="feedbackAudio" value="correctNote">
            <label for="correctNoteRadio">Note played</label><br>
        </div>
    </div>
    <script src="script.js"></script>


</body>
</html>
